<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>3D Multiplayer Lobby</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu">
    <h1>3D Multiplayer Lobby</h1>
    <input id="nameInput" placeholder="Username">
    <div id="rooms"></div>
  </div>

  <div id="game" class="hidden">
    <div id="hud">
      <button id="leaveBtn">Leave</button>
      <span id="roomTitle">Lobby</span>
      <span id="playerCount">0 players</span>
    </div>

    <div id="crosshair">+</div>

    <div id="chatBox">
      <div id="messages"></div>
      <form id="chatForm">
        <input id="chatInput" placeholder="Chat..." autocomplete="off">
        <button>Send</button>
      </form>
    </div>

    <button id="lookBtn">Tap to Look Around</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
